<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Veronicat — vertical slice</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="objective"></div>
      <div id="prompts"></div>
      <div id="toast"></div>
      <div id="debug" hidden></div>
      <div id="hint"></div>
      <div id="card"></div>
      <div id="subs"></div>
      <div id="vignette"></div>
    </div>

    <div id="title" class="overlay menu">
      <div class="panel">
        <div class="kicker">vertical slice · v0.2 · Csillag-lakótelep</div>
        <h1>Füst</h1>
        <div id="loading">Betöltés…</div>
      </div>
    </div>

    <div id="end" class="overlay" hidden>
      <div class="panel">
        <div class="kicker">zzz</div>
        <h1>Szundi.</h1>
        <p class="lede">Ez a vertical slice vége. Innen jön Veronika világa.</p>
        <ul class="summary"></ul>
        <button id="again">Még egyszer</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
